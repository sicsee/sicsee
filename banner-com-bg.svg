<svg width="1280" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Overlay escuro gradiente para legibilidade -->
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#0d1220" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0f1525" stop-opacity="0.55"/>
    </linearGradient>
    
    <!-- Gradiente texto roxo/amarelo -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e8d5ff"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    
    <!-- Glow sutil -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Barra amarela lateral -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcc44"/>
    </linearGradient>
  </defs>
  
  <!-- Background image hosted on GitHub -->
  <image href="https://raw.githubusercontent.com/sicsee/sicsee/main/assets/banner1_a5d32b.jpg" width="1280" height="360" preserveAspectRatio="xMidYMid slice"/>
  
  <!-- Overlay escuro -->
  <rect width="1280" height="360" fill="url(#overlay)"/>
  
  <!-- Barra lateral amarela -->
  <rect x="60" y="60" width="5" height="240" rx="2.5" fill="url(#barGrad)"/>
  
  <!-- Nome principal -->
  <text x="85" y="135" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" 
        font-size="44" font-weight="800" fill="url(#textGrad)" filter="url(#glow)">
    Nicolas Godinho
  </text>
  
  <!-- Curso + Localização -->
  <text x="85" y="182" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" 
        font-size="20" font-weight="400" fill="rgba(255,255,255,0.85)">
    Ciência da Computação • Minas Gerais, Brasil
  </text>
  
  <!-- Foco atual badge -->
  <g transform="translate(85, 205)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="rgba(163,113,247,0.2)" stroke="#a371f7" stroke-width="1.5"/>
    <text x="110" y="23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
          font-size="13" font-weight="600" fill="#f5a623">
      🎯 Focado em Backend agora
    </text>
  </g>
  
  <!-- Stack pills -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500" transform="translate(85, 255)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="42" height="24" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text x="21" y="15.5" text-anchor="middle" fill="white" font-size="11">C</text>
    </g>
    <g transform="translate(50, 0)">
      <rect x="0" y="0" width="50" height="24" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text x="25" y="15.5" text-anchor="middle" fill="white" font-size="11">PHP</text>
    </g>
    <g transform="translate(108, 0)">
      <rect x="0" y="0" width="60" height="24" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text x="30" y="15.5" text-anchor="middle" fill="white" font-size="11">MySQL</text>
    </g>
    <g transform="translate(176, 0)">
      <rect x="0" y="0" width="50" height="24" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text x="25" y="15.5" text-anchor="middle" fill="white" font-size="11">JS</text>
    </g>
    <g transform="translate(234, 0)">
      <rect x="0" y="0" width="72" height="24" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text x="36" y="15.5" text-anchor="middle" fill="white" font-size="11">Tailwind</text>
    </g>
    <g transform="translate(314, 0)">
      <rect x="0" y="0" width="48" height="24" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text x="24" y="15.5" text-anchor="middle" fill="white" font-size="11">Vite</text>
    </g>
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="100" height="24" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text x="50" y="15.5" text-anchor="middle" fill="white" font-size="11">Neps Academy</text>
    </g>
  </g>
  
  <!-- Linha divisória sutil -->
  <line x1="60" y1="315" x2="1220" y2="315" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- GitHub link -->
  <text x="640" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-size="11" fill="rgba(255,255,255,0.45)">
    github.com/sicsee
  </text>
</svg>