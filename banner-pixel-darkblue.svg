<svg width="1280" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Solid dark blue overlay - no gradient -->
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#081025" stop-opacity="0.88"/>
    </linearGradient>
    
    <!-- Pixel font style -->
    <style>
      <![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        .pixel-font {
          font-family: 'Press Start 2P', 'Courier New', monospace;
          font-size: 16px;
        }
        .pixel-font-small {
          font-family: 'Press Start 2P', 'Courier New', monospace;
          font-size: 10px;
        }
      ]]>
    </style>
  </defs>
  
  <!-- Background image -->
  <image href="https://raw.githubusercontent.com/sicsee/sicsee/main/assets/banner-bg-new.png" 
         width="1280" height="360" preserveAspectRatio="xMidYMid slice"/>
  
  <!-- Solid dark blue overlay -->
  <rect width="1280" height="360" fill="url(#overlay)"/>
  
  <!-- Left accent bar - dark blue -->
  <rect x="60" y="60" width="4" height="240" rx="2" fill="#1a2a4a"/>
  
  <!-- Main name - pixel font style -->
  <text x="85" y="145" 
        font-family="'Press Start 2P', 'Courier New', monospace" 
        font-size="28" font-weight="normal" fill="#e8e8e8" 
        style="paint-order: stroke fill; stroke: #081025; stroke-width: 2;">
    NICOLAS GODINHO
  </text>
  
  <!-- Subtitle: Course + Location -->
  <text x="85" y="195" 
        font-family="'Press Start 2P', 'Courier New', monospace" 
        font-size="10" font-weight="normal" fill="#a8b8d8">
    CIENCIA DA COMPUTACAO  *  MINAS GERAIS, BRASIL
  </text>
  
  <!-- Focus badge - simple pixel style -->
  <g transform="translate(85, 215)">
    <rect x="0" y="0" width="320" height="32" rx="0" fill="#0d1b3a" stroke="#1a2a4a" stroke-width="2"/>
    <text x="160" y="21" text-anchor="middle" 
          font-family="'Press Start 2P', 'Courier New', monospace" 
          font-size="9" fill="#4da6ff">
      FOCO: BACKEND
    </text>
  </g>
  
  <!-- Divider line -->
  <line x1="60" y1="270" x2="1220" y2="270" stroke="#1a2a4a" stroke-width="2"/>
  
  <!-- GitHub link - pixel style -->
  <text x="640" y="310" text-anchor="middle" 
        font-family="'Press Start 2P', 'Courier New', monospace" 
        font-size="9" fill="#4a5a7a">
    GITHUB.COM/SICSEE
  </text>
  
  <!-- Bottom copyright line -->
  <text x="640" y="340" text-anchor="middle" 
        font-family="'Press Start 2P', 'Courier New', monospace" 
        font-size="7" fill="#3a4a6a">
    2024  *  BACKEND DEVELOPER IN TRAINING
  </text>
</svg>